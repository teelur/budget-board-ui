name: Canary Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build library
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Set canary version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          CANARY_VERSION="$BASE_VERSION-canary.${GITHUB_RUN_NUMBER}.$SHORT_SHA"
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.version = process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');" "$CANARY_VERSION"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: |
            package.json
            yarn.lock
            .yarnrc.yml
            README.md
            LICENSE
            dist
          if-no-files-found: error

  publish-github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package
          path: .

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Configure GitHub Packages registry
        run: |
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.publishConfig = { ...(pkg.publishConfig || {}), registry: 'https://npm.pkg.github.com' }; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Publish canary package to GitHub Packages
        run: yarn npm publish --tag canary --tolerate-republish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ github.token }}

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: package
          path: .

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish canary package to npm
        run: |
          npm pkg delete publishConfig.registry
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@teelur/budget-board-ui@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@teelur/budget-board-ui@$PACKAGE_VERSION is already published to npm; skipping."
          else
            TARBALL=$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --json | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input)[0].filename));')
            npm publish "$RUNNER_TEMP/$TARBALL" --access public --tag canary --registry=https://registry.npmjs.org
          fi
