name: Release Build

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build library
        run: yarn build

      - name: Run tests
        run: yarn test

      - name: Verify release tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_NAME" ]; then
            echo "Release tag ($GITHUB_REF_NAME) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Set GitHub Packages publish registry
        run: |
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.publishConfig = { ...(pkg.publishConfig || {}), registry: 'https://npm.pkg.github.com' }; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Publish package to GitHub Packages
        run: yarn npm publish --tolerate-republish
        env:
          YARN_NPM_AUTH_TOKEN: ${{ github.token }}

      - name: Configure npm registry
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set npm publish registry
        run: |
          node -e "const fs = require('fs'); const pkg = require('./package.json'); pkg.publishConfig = { ...(pkg.publishConfig || {}), registry: 'https://registry.npmjs.org' }; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"

      - name: Publish package to npm
        run: |
          npm pkg delete publishConfig.registry
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@teelur/budget-board-ui@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "@teelur/budget-board-ui@$PACKAGE_VERSION is already published to npm; skipping."
          else
            npm publish --access public --registry=https://registry.npmjs.org
          fi
